<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 1. VIEWPORT META TAG: Makes the page look good on phones -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple Page</title>
</head>

<!-- 2. BODY TAG: Contains the visible content of the page -->
<body bgcolor="lightblue">

    <!-- 3. HEADINGS: There are 6 levels of headings, from h1 (biggest) to h6 (smallest) -->
    <h1 align="center ">This is a Heading 1 (Biggest)</h1>
    <h2>This is a Heading 2</h2>
    <h3>This is a Heading 3</h3>

    <!-- 4. PARAGRAPHS: Used for writing sentences and long text -->
    <p>This is a normal paragraph. It is used for writing sentences and long text.</p>

    <!-- 5. LISTS: Used to display items in a list format -->
    <p>My favourite fruits:</p>
    <ul>
        <li>Apples</li>
        <li>Bananas</li>
        <li>Oranges</li>
    </ul>

    <!-- 6. LINKS: Used to create hyperlinks to other pages or websites -->
    <p>Visit <a href="https://www.google.com">Google here</a> (click the blue text) </p>

    <!-- 7. IMAGES: Used to display images on the page -->
    <p>Here is a placeholder image: </p>
    <img src="https://media.istockphoto.com/id/119838172/photo/close-up-of-mixed-breed-monkey-between-chimpanzee-and-bonobo-smiling.jpg?s=612x612&w=0&k=20&c=k48IdB7w0kJHFhtWcYIlKQxqxENXJwZ66qAcX_BuBjg=" alt="A monkey">
    


</body>
</html>
