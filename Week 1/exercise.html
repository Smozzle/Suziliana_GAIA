<!DOCTYPE html>
<html>
    <head>
        <title>Table Example</title>
    </head>
    <body>
        <h3 align="center">Comparison of Models</h3>
        <table border="1" width="600" cellpadding="5" cellspacing="0" align="center">
            <tr>
                <th>Model</th>
                <th>OS</th>
                <th>Display</th>
                <th>RAM</th>
            </tr>
            <tr>
                <td align="center">Samsang Galaxy S7</td>
                <td align="center" rowspan="2">Android</td>
                <td align="center">5.1”</td>
                <td align="center">4 GB</td>
            </tr>
            <tr>
                <td align="center">Sony Xperia Z5</td>
                <td align="center">4.6“</td>
                <td align="center" rowspan="2">2 GB</td>
            </tr>
            <tr>
                <td align="center">Apple iPhone 6s</td>
                <td align="center">iOS</td>
                <td align="center">4.7“</td>
            </tr>
        </table>
    </body>
</html>
